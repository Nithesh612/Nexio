<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Modern Deep Obsidian Background -->
    <linearGradient id="nexioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#18152e" />
    </linearGradient>
    
    <!-- Ultra-Crisp Precision 'N' Stroke Gradient -->
    <linearGradient id="nexioStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glowing Accent Sparkle -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Subtle Edge Glass Highlight -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.3)" />
      <stop offset="100%" stop-color="rgba(129, 140, 248, 0.4)" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Squircle Base -->
  <rect width="32" height="32" rx="8.5" fill="url(#nexioBg)" />
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.75" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Iconic Precision Nexio 'N' Monogram -->
  <path
    d="M9.5 22.5V9.5L22.5 22.5V9.5"
    stroke="url(#nexioStroke)"
    stroke-width="2.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Top-Right Accent Star Point -->
  <circle cx="23" cy="9" r="1.5" fill="url(#sparkGrad)" />
</svg>